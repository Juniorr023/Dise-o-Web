        <script>
            let numero = [1,2,3,4,5,6];
            let contador = 0;
            let impares = 0;
            for (let num of numero){
                if (num % 2 === 0){
                    contador ++;
                }else{
                    impares ++;
                }
            }
            document.write("Cantidad de pares: ", contador);
            document.write("Cantidad de impares: ", impares);
        </script>
</html>
