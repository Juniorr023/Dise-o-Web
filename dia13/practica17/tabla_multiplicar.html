<!DOCTYPE html>
<html lang="es-PY">
    <head>
        <meta charset="UTF-8">

        <style>

            *{
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                font-size: 14pt;
            }
        </style>

    </head>
    <body>

        <h3> Tabla de Multiplicar</h3>
        <input type="number" id="numero">
        <button id="btn_generar"> Generar Tabla</button>

        <hr>

        <div id="tabla"></div>
    </body>

        <script>

            let numtexto = document.getElementById("numero");
            let btn = document.getElementById("btn_generar");

            btn.addEventListener("click", function(){
                let num = parseFloat(numtexto.value);
                let tabla = document.getElementById("tabla");
                tabla.innerHTML =" ";

                for(let x = 1; x <= 10; x++){
                    tabla.innerHTML += ` ${num} x ${x} = ${ num * x} <br>`
                }
            });
        </script>

</html>
